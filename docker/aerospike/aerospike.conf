service {
    cluster-name bifrost-local

    enforce-best-practices false

    proto-fd-max 15000

    feature-key-file /etc/aerospike/features.conf
}

logging {
    console {
        context any info
    }
}

mod-lua {
    allow-unsafe-lua false
}

network {
    service {
        address any
        port 3000
    }

    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }

    fabric {
        address any
        port 3001
    }

    admin {
        address any
        port 3003
    }
}

security {
    default-password-file /opt/aerospike/etc/admin-password
}

namespace test {
    replication-factor 1

    storage-engine memory {
        file /opt/aerospike/data/test.dat
        filesize 1G
    }
}